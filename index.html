<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f1b2d;--mute:#5b6779;--line:#e3e8ef;--tag:#06203f;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;display:flex;justify-content:center;padding:20px 14px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px}
.banner{position:relative;height:190px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#032a52,#0058a8 60%,#0a7be0)}
.banner span{position:absolute;display:block;border-radius:50% 10% 50% 20%}
.y{background:#ffd800;width:150px;height:60px;right:-20px;top:40px;transform:rotate(-25deg)}
.k{background:#111;width:110px;height:90px;right:60px;top:10px;transform:rotate(30deg)}
.m{background:#e6007e;width:150px;height:55px;right:20px;top:105px;transform:rotate(-10deg)}
.c{background:#00b4f0;width:170px;height:60px;right:-30px;top:125px;transform:rotate(-20deg)}
.tag{position:absolute;left:16px;bottom:16px;background:var(--tag);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px}
h1{font-size:28px;line-height:1.2;margin:16px 4px 8px;font-weight:600}
.sub{text-align:center;color:var(--mute);margin:0 0 4px;font-size:17px}
.sub2{text-align:center;color:var(--mute);margin:0 0 16px;font-size:14px}
hr{border:0;border-top:1px solid var(--line);margin:0 4px 6px}
a.row{display:flex;align-items:center;gap:14px;padding:14px 4px;color:inherit;text-decoration:none}
a.row+a.row{border-top:1px solid var(--line)}
.ic{width:34px;height:34px;flex:none;display:grid;place-items:center;font-weight:700;border-radius:10px;color:#fff;font-size:15px}
.fb{background:#1877f2}.mp{background:#ea4335}.em{background:#334155}.wa{background:#25d366}
.t{flex:1;min-width:0}.t b{display:block;font-weight:600;font-size:18px}.t small{display:block;color:var(--mute);font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.qr{margin:20px 4px 4px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
#qrbox{display:inline-block;background:#fff;padding:12px;border-radius:14px}
.qr p{color:var(--mute);font-size:13px;margin:10px 0 0}
</style>
</head>
